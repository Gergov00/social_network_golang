name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [auth-service, user-service, post-service, gateway, pkg]
    defaults:
      run:
        working-directory: backend/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/**/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Test with race detector
        run: go test ./... -count=1 -race
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  auth-integration:
    name: Auth PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgres://postgres:ci-test-password@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/**/go.sum
      - name: Test real transactions and concurrency
        run: go test -tags=integration ./... -count=1 -race

  proto-drift:
    name: Protobuf lint and generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/**/go.sum
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.72.0
          setup_only: true
      - name: Install pinned generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Lint protobuf
        run: buf lint
      - name: Regenerate protobuf
        run: buf generate
      - name: Check generated files
        run: |
          git diff --exit-code -- pkg/gen
          if [ -n "$(git ls-files --others --exclude-standard -- pkg/gen)" ]; then
            echo "Generated files are missing from Git"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, user-service, post-service, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --file backend/${{ matrix.service }}/Dockerfile --tag ahishka/${{ matrix.service }}:ci backend/
