syntax = "proto3";

package ahishka.post.v1;

import "google/protobuf/timestamp.proto";

option go_package = "ahishka/pkg/gen/ahishka/post/v1;postv1";

// PostService — посты и лента.
//
// ВАЖНО: ни в одном запросе НЕТ поля автора или «кто смотрит». Личность
// вызывающего приходит исключительно в gRPC-metadata "x-user-id", которую
// ставит gateway из провалидированного JWT. Поля сообщений отвечают только
// на вопрос «про что» (id поста, курсор, лимит, текст). Добавить сюда
// author_id значит дать любому клиенту gateway писать от чужого имени.
service PostService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
  rpc ListUserPosts(ListUserPostsRequest) returns (ListUserPostsResponse);
  rpc LikePost(LikePostRequest) returns (LikePostResponse);
  rpc UnlikePost(UnlikePostRequest) returns (UnlikePostResponse);
}

message Post {
  string id = 1;
  // author_id == users.id из user-service. Имени/handle тут нет: их
  // добирает gateway из user-service (database-per-service).
  string author_id = 2;
  string text = 3;
  int32 likes_count = 4;
  // liked — относительно вызывающего, а не свойство поста.
  bool liked = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  int32 comments_count = 8;
}

message CreatePostRequest {
  string text = 1;
}

message CreatePostResponse {
  Post post = 1;
}

message GetPostRequest {
  string id = 1;
}

message GetPostResponse {
  Post post = 1;
}

// cursor — непрозрачная строка из next_cursor предыдущей страницы. Пустая
// строка означает «с начала ленты». limit <= 0 означает «дефолт сервера».
message GetFeedRequest {
  string cursor = 1;
  int32 limit = 2;
}

// next_cursor пустой, если страниц больше нет.
message GetFeedResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
}

message LikePostRequest {
  string post_id = 1;
}

// Возвращаем пост целиком: клиент делает оптимистичный апдейт и должен
// уметь сверить его с настоящим счётчиком одним ответом.
message LikePostResponse {
  Post post = 1;
}

message UnlikePostRequest {
  string post_id = 1;
}

message UnlikePostResponse {
  Post post = 1;
}

// author_id тут — ФИЛЬТР «чьи посты показать», а не «кто пришёл». Это
// по-прежнему вопрос «про что», и заголовочное правило файла он не нарушает:
// личность зрителя (от неё зависит liked) едет только в metadata x-user-id.
// Если когда-нибудь захочется вычислить автора из этого поля — нельзя.
message ListUserPostsRequest {
  string author_id = 1;
  string cursor = 2;
  int32 limit = 3;
}

message ListUserPostsResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
}

// CommentService — комментарии к постам. Правило то же, что у PostService:
// автора и зрителя сообщения НЕ несут, они приезжают в metadata x-user-id.
// post_id и comment_id — это «про что», а не «кто».
service CommentService {
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);
  rpc UnlikeComment(UnlikeCommentRequest) returns (UnlikeCommentResponse);
}

message Comment {
  string id = 1;
  string post_id = 2;
  // author_id == users.id из user-service; имя/handle добирает gateway.
  string author_id = 3;
  string text = 4;
  int32 likes_count = 5;
  // liked — относительно вызывающего, а не свойство комментария.
  bool liked = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Комментарии отдаются ПО ВОЗРАСТАНИЮ created_at — обсуждение читается
// сверху вниз, в отличие от ленты.
message ListCommentsRequest {
  string post_id = 1;
  string cursor = 2;
  int32 limit = 3;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  string next_cursor = 2;
}

message CreateCommentRequest {
  string post_id = 1;
  string text = 2;
}

message CreateCommentResponse {
  Comment comment = 1;
}

message LikeCommentRequest {
  string comment_id = 1;
}

message LikeCommentResponse {
  Comment comment = 1;
}

message UnlikeCommentRequest {
  string comment_id = 1;
}

message UnlikeCommentResponse {
  Comment comment = 1;
}
